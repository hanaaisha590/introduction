<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            background-color: black;
            color: burlywood;
            border: 1px solid rgb(113, 233, 119);
            font-family: Arial;
        }

        .title{
            text-align: center;
            color: lightseagreen;
        }

    .player-card{
        display: block;
        background: rgb(59, 58, 58);
        padding: 20px;
        border: 1px solid white;
        border-radius: 10px;
        margin-top: 20px;
    }

    .badge{
        display: inline;
        background: rgb(50, 43, 43);
        color: rgb(92, 143, 188);
        padding: 20px;
        margin-right: 10px;
        border-radius: 10px;

    }

    .secret-message{
        display: none;
    }
    .game-card{
        background: blanchedalmond;
        color: black;
        padding: 20px;
        width: 100px;
        border-radius: 15px;
        text-align: center;
    }
    </style>
</head>
<body>
    <h1 class="title">Game Zone</h1>
    <div class="player-card">
        <h2>Player;Shadow Ninja</h2>
        <p>Leval 99 Warrior</p>
    </div>
    <div class="player-card">
        <h2>Player;kimothy</h2>
        <p>Leval 201 king</p>
    </div>
    <div class="player-card">
        <h2>Player;Narotto</h2>
        <p>Leval 500 Mansion</p>
    </div>
    <div class="badges">
        <span class="badge">Pro</span>
        <span class="badge">Leader</span>
        <span class="badge">Fast</span>
    </div>
    <div class="secret-message">Secret Weapon Unlocked</div>
    <div class="game-comtainer">
        <div class="game-card">
            <h3>Mine Craft</h3>
            <p>Building Adventure</p>
        </div>
         <div class="game-card">
            <h3>Subway Surfaces</h3>
            <p>Run away from police</p>
        </div>
         <div class="game-card">
            <h3>Dr Driving</h3>
            <p>Drive your vehicle with traffic rules</p>
        </div>
    </div>
</body>
</html>
