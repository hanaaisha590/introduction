<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        p{color-scheme: red;}

        div .ex1{display: none;

        }

        div .ex2{
            color: red;
            background-color: aqua;
            display: block;
        }



        div .ex3{
            
            color: red;
            background-color: rgb(63, 246, 72);
            display: inline;
        }



    </style>
</head>
<body>
    <div>
       Display none;to show nothing.
       <p class="ex1">Hello Display none</p>
    </div>
    <div>
        Display block;nothing beside
        <p class="ex2"> Hello Display block</p>
    </div>
    <div>
        Display line;similar to span tag
        <p class="ex3">Hello Display inline</p>
    </div>
</body>
</html>
