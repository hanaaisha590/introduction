<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu Card</title>
    <style>
        .kil{
            border:20px;
            width: 250px;
            text-align: center;
            border-radius:12px ;
            padding: 3px;
            margin: 12px;
            background-color:brown;
            color: burlywood;
            box-shadow: 0 4px;
            
        }


        .kil img {
            width: 100%;
            height: 200px;
            object-fit: scale-down;
            border-radius: 2px;
        }

        .class button{
            background-color:antiquewhite(246, 246, 162);
            color: brown;
            padding: 2px;
            border: 3px;
        }
        .class h2{
            text-decoration-line: underline;
            background-color: rgb(226, 121, 121);
            .class :hover{
                box-shadow:2px 4px blueviolet ;
                transition: 2s;
            }
        }
    </style>
</head>
<body>
    <div class="kil">
        <img src="https://plus.unsplash.com/premium_photo-1673545518947-ddf3240090b1?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8OXx8Y29mZmVlfGVufDB8fDB8fHww"
         width="250"
         height="250"   
        >
        <h2>Coffee</h2>
        <p>RS 55.00 <del>RS 62.00</del></p>
        <button> Buy Now</button>
    </div>

     <div class="kil">
        <img src="https://images.unsplash.com/photo-1426869884541-df7117556757?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8MTR8fGN1cGNha2VzfGVufDB8fDB8fHww"
        width="250"

        width="250"
