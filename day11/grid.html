<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box{
            background-color: aqua;
            border: 1px solid black;
            padding: 20px;
            text-align: center;
            font-size: larger;
            font-family: Arial;
        }

        .products{
            display: grid;
            grid-template-columns: repeat(3,1fr);
            background: rgb(43, 43, 174);
            padding: 10px;
            gap: 15px;
        }
    </style>
</head>
<body>
    <div class="products">
        <div class="box">Cake</div>
        <div class="box">Price;$20</div>
        <div class="box">Cookie</div>
        <div class="box">Price;$15</div>
        <div class="box">Crosant</div>
        <div class="box">Price;$25</div>
    </div>
</body>
</html>
